name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q api app

      - name: Check pipeline loading and prediction
        run: |
          python - <<'PY'
          import numpy as np
          import pandas as pd

          from api.main import pipeline, feature_names

          sample = pd.DataFrame(
              [[np.nan] * len(feature_names)],
              columns=feature_names,
          )

          prediction = pipeline.predict(sample)
          probabilities = pipeline.predict_proba(sample)

          assert prediction.shape == (1,)
          assert prediction[0] in (1, 2, 3)
          assert probabilities.shape == (1, 3)
          assert np.isfinite(probabilities).all()
          assert np.allclose(probabilities.sum(axis=1), 1.0)

          print("Pipeline loading and prediction passed.")
          PY

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build Docker image
        run: docker build -t uk-accident-prediction:ci .